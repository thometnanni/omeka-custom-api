services:
  cua_api:
    build: .
    container_name: cua_api
    restart: always
    env_file: .env
    environment:
      # keep the snapshot across deploys, so the API starts serving immediately
      EXPORT_PATH: /app/data/export.json
    ports:
      - "8001:3000"
    volumes:
      - api-data:/app/data

volumes:
  api-data:
